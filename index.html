<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portofolio von Jamie Achatz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <h1 class="title">Portofolio von Jamie Achatz</h1>
    <p class="welcome">Hallo, ich bin Jamie Achatz und ich mache gerne Web und Android Apps.</p>
    <h1 class="langstitle">Hier sind Programmiersprachen mit denen ich gearbeitet habe aufgelistet.</h1>
    <div class="langs">$
        <div class="java">
            <div class="javapicdiv">
                <img src="images/java.png" alt="Java Logo">
            </div>
            <h2 class="javatxt">Java</h2>
        </div>
        <div class="html">
            <div class="htmlpicdiv">
                <img src="images/html.png" alt="HTML Logo">
            </div>
            <h2 class="htmltxt">HTML 5</h2>
        </div>
        <div class="cs">
            <div class="cspicdiv">
                <img src="images/cs.png" alt="C# Logo">
            </div>
            <h2 class="cstxt">C#</h2>
        </div>
        <div class="css">
            <div class="csspicdiv">
                <img src="images/css.png" alt="CSS Logo">
            </div>
            <h2 class="csstxt">CSS</h2>
        </div>
    </div>
    <footer>
        <p>&copy;  2026 Jamie Achatz</p>
    </footer>
</body>
</html>
