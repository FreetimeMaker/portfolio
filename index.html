<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio von Jamie Achatz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <h1 class="title">Portofolio von Jamie Achatz</h1>
    <p class="welcome">Hallo, ich bin Jamie Achatz und ich mache gerne Web und Android Apps.</p>
    <h1 class="langstitle">Hier sind Technologien mit denen ich gearbeitet habe aufgelistet.</h1>
    <div>
        <div class="langs">
            <div class="java">
                <div class="javapicdiv">
                    <img src="images/java.png" alt="Java Logo">
                </div>
                <h2 class="javatxt">Java</h2>
            </div>
            <div class="html">
                <div class="htmlpicdiv">
                    <img src="images/html.png" alt="HTML Logo">
                </div>
                <h2 class="htmltxt">HTML 5</h2>
            </div>
            <div class="cs">
                <div class="cspicdiv">
                    <img src="images/cs.png" alt="C# Logo">
                </div>
                <h2 class="cstxt">C#</h2>
            </div>
            <div class="css">
                <div class="csspicdiv">
                    <img src="images/css.png" alt="CSS Logo">
                </div>
                <h2 class="csstxt">CSS</h2>
            </div>
        </div>
        <div class="langs">
            <div class="gh">
                <div class="ghpicdiv">
                    <img src="images/gh.png" alt="GitHub Logo">
                </div>
                <h2 class="ghtxt">GitHub</h2>
            </div>
            <div class="git">
                <div class="gitpicdiv">
                    <img src="images/git.png" alt="Git Logo">
                </div>
                <h2 class="gittxt">Git</h2>
            </div>
            <div class="gitlab">
                <div class="gitlabpicdiv">
                    <img src="images/gitlab.png" alt="GitLab Logo">
                </div>
                <h2 class="gitlabtxt">GitLab</h2>
            </div>
            <div class="kt">
                <div class="ktpicdiv">
                    <img src="images/kt.png" alt="Kotlin Logo">
                </div>
                <h2 class="kttxt">Kotlin</h2>
            </div>
            <div class="linux">
                <div class="linuxpicdiv">
                    <img src="images/linux.png" alt="Linux Logo">
                </div>
                <h2 class="linuxtxt">Linux</h2>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy;  2026 Jamie Achatz</p>
    </footer>
</body>
</html>
