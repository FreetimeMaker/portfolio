<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SuperSMP Companion</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicons/android-chrome-512x512.png">
    <link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
    <link rel="manifest" href="favicons/site.webmanifest">
</head>
<body>
    <button id="darkModeBtn" class="darkmodebtn">🌙 Dark Mode</button>
    <h1 class="ssmpcactiontxt">Hier sieht man SuperSMP Companion in Action.</h1>
    <div class="ssmpcactionsdiv">
        <div class="ssmpcaction1">
            <img class="ssmpcactionpic1" src="images/ssmpcaction1.png" alt="First Picture of SuperSMP Companion in Action">
            <h2 class="ssmpcactiontxt1">SuperSMP Companion Shopseite mit Cookies Text</h2>
        </div>
        <div class="ssmpcaction2">
            <img class="ssmpcactionpic2" src="images/ssmpcaction2.png" alt="Second Picture of SuperSMP Companion in Action">
            <h2 class="ssmpcactiontxt2">SuperSMP Companion Shopseite ohne Cookies Text</h2>
        </div>
        <div class="ssmpcaction3">
            <img class="ssmpcactionpic3" src="images/ssmpcaction3.png" alt="Third Picture of SuperSMP Companion in Action">
            <h2 class="ssmpcactiontxt3">SuperSMP Kartenseite</h2>
        </div>
    </div>
    <a href="https://github.com/FreetimeMaker/SuperSMP-Companion-App"><h1>Hier ist der Quellcode von SuperSMP Companion</h1></a>
</body>
</html>
