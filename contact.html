<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontakt</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/png" href="/favicons/android-chrome-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/favicons/site.webmanifest?v=2">
</head>
<body>
    <button id="darkModeBtn" class="darkmodebtn">🌙 Dark Mode</button>
    <h1 class="kontaktieren">Kontaktieren Sie mich hier</h1>
    <div class="formularmail">
        <div class="formular">
            <form class="contact-form" method="post" action="/api/contact">
                <div class="form-row">
                    <label for="name">Name:</label>
                    <input id="name" type="text" name="name" required>
                </div>
                <div class="form-row">
                    <label for="email">E-mail:</label>
                    <input id="email" type="email" name="email" required>
                </div>
                <div class="form-row comment-row">
                    <label for="comment">Nachricht:</label>
                    <textarea id="comment" name="message" rows="5" cols="40" required></textarea>
                </div>
                <div class="form-row submit-row">
                    <input type="submit" name="submit" value="Einreichen">
                </div>
            </form>
        </div>

        <div class="maildiv">
        <p>oder via <a class="mail" href="mailto:FreetimeMaker@proton.me">E-Mail</a></p>
        </div>
        <footer>
            <p>&copy;  2026 FreetimeMaker</p>
        </footer>
    </div>
    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="z5-kddSDRP_Lmwaz0Yg3C";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>
</body>
</html>
